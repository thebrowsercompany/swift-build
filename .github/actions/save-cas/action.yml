name: "Save CAS"
description: "Save CAS with S3"

inputs:
  cache-key:
    description: "The cache key."
    required: true
  s3-bucket:
    description: "The s3 bucket to use for cache storage."
    required: false
  s3-bucket-encryption:
    description: "Whether to enable server-side encryption for the S3 bucket."
    required: false
    default: "true"
  aws-arn:
    description: "The ARN of the AWS role to assume which has read/write access to the S3 bucket."
    required: false
  aws-region:
    description: "The region of the S3 bucket to use for the cache"
    required: false
  trim-sparse-files:
    description: "Whether to trim sparse files in the CAS"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Configure CAS
      shell: pwsh
      env:
        INPUT_AWS_ARN: ${{ inputs.aws-arn }}
        INPUT_S3_BUCKET: ${{ inputs.s3-bucket }}
        INPUT_S3_BUCKET_ENCRYPTION: ${{ inputs.s3-bucket-encryption }}
        INPUT_AWS_REGION: ${{ inputs.aws-region }}
      run: |
        $AWSArn = $env:INPUT_AWS_ARN
        if ($AWSArn) {
          $requiredParams = @{
              's3-bucket' = $env:INPUT_S3_BUCKET
              's3-bucket-encryption' = $env:INPUT_S3_BUCKET_ENCRYPTION
              'aws-region' = $env:INPUT_AWS_REGION
          }

          foreach ($param in $requiredParams.GetEnumerator()) {
              if ([string]::IsNullOrEmpty($param.Value)) {
                  Write-Error -Message "$($param.Key) input cannot be empty when aws-arn is provided" -ErrorAction Stop
              }
          }
        } else {
          Write-Host "Error: AWS ARN isn't set."
          exit(1)
        }

    - name: Authenticate to AWS
      id: aws-credentials
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
      if: inputs.aws-arn != ''
      with:
        role-to-assume: ${{ inputs.aws-arn }}
        role-session-name: ToolchainCISccacheAccess
        aws-region: ${{ inputs.aws-region }}
        special-characters-workaround: 'true' # special characters in secrets can cause SignatureDoesNotMatch errors

    - name: Save
      shell: pwsh
      run: |
        function TrimSparseFiles {
          param([string[]]$paths)
          foreach ($path in $paths) {
            $fs=$null
            try {
              $fs=[System.IO.File]::Open($path, 'Open', 'ReadWrite', 'None')
              if ($fs.Length -lt 32) { throw "File is too small to contain required header data." }
              $header=New-Object byte[] 8
              if ($fs.Read($header,0,8) -ne 8) { throw "Failed to read file header." }
              # Trim the logical file size to the end of the bump pointer.
              # https://github.com/swiftlang/llvm-project/blob/415d0b3fec3afac24542cd21ce6333751446fd19/llvm/lib/CAS/OnDiskHashMappedTrie.cpp#L120
              $magic=[System.BitConverter]::ToUInt64($header,0)
              if ($magic -ne ([uint64]0x00FFDA7ABA53FF00)) { throw ("Invalid file magic: 0x{0:X16}" -f $magic) }
              $fs.Seek(24,[System.IO.SeekOrigin]::Begin)|Out-Null
              $buffer=New-Object byte[] 8
              if ($fs.Read($buffer,0,8) -ne 8) { throw "Failed to read 8 bytes at offset 24." }
              $targetLength=[System.BitConverter]::ToUInt64($buffer,0)
              $currentLength=[uint64]$fs.Length
              Write-Host ("{0}: current={1:N0}, target={2:N0}" -f $path, $currentLength, $targetLength)
              if ($targetLength -lt $currentLength) {
                $fs.SetLength([int64]$targetLength)
                Write-Host ("Trimmed to {0:N0}." -f $targetLength)
              } else {
                Write-Host "No trim needed."
              }
            } catch {
              Write-Host "ERROR processing file: $path"
              throw
            } finally {
              if ($fs) { $fs.Close() }
            }
          }
        }
        $cas_path = "$env:GITHUB_WORKSPACE\cas"
        $cas_tgz = "cas-${{ inputs.cache-key }}.tgz"
        $s3_bucket = "${{ inputs.s3-bucket }}"
        $s3_key = $cas_tgz
        $s3_path = "s3://$s3_bucket/$s3_key"
        if (Test-Path "$cas_path" -PathType Container) {
          Write-Host "Found CAS at $cas_path"
          if (${{ inputs.trim-sparse-files == 'true' && '$True' || '$False' }}) {
            $SparseFiles = Get-ChildItem "$cas_path" -Recurse -File -Include v9.index, v9.data, v4.actions
            TrimSparseFiles $SparseFiles.FullName
          }
          $stats = Get-ChildItem "$cas_path" -Recurse -File | Measure-Object Length -Sum
          "CAS: {0} files, {1:N2} MB" -f $stats.Count, ($stats.Sum / 1MB)
          $temp_dir = Join-Path $env:TEMP ("my-temp-dir-" + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $temp_dir | Out-Null
          $temp_path = "$temp_dir\$cas_tgz"
          Get-PSDrive
          Push-Location "$cas_path"
          tar --sparse --force-local -cf "$temp_path" *
          if ($LASTEXITCODE -ne 0) {
            Write-Host "tar failed, creating an empty tarball instead"
            if (Test-Path "$temp_path") {
              Remove-Item "$temp_path" -Force
            }
            tar --force-local -cf "$temp_path" --files-from $null
          }
          Pop-Location
          $FileSize = (Get-Item $temp_path).Length
          Write-Host "$cas_tgz file size $FileSize bytes"
          Write-Host "Archieved CAS to $temp_path"
          aws s3 cp $temp_path $s3_path --no-progress
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -eq 0) {
            Write-Host "Uploaded $temp_path to $s3_path"
          } else {
            Write-Host "Failed to upload $temp_path to $s3_path"
          }
        } else {
          Write-Host "Didn't find CAS at $cas_path. CAS not saved."
        }
