name: Setup Azure Key Vault signing
description: Install AzureSignTool and configure a Key Vault-backed signing command.

inputs:
  key-vault-uri:
    description: URI of the Azure Key Vault that contains the signing certificate.
    required: true
  certificate-name:
    description: Name of the signing certificate in Azure Key Vault.
    required: true
  azure-credentials:
    description: Azure service principal credentials used by azure/login; AzureSignTool reuses the resulting Azure CLI session.
    required: true
  swift-installer-scripts-path:
    description: Optional path to a swift-installer-scripts checkout where the action will configure the signing command.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install AzureSignTool
      shell: pwsh
      run: |
        dotnet tool install --global AzureSignTool --add-source "https://api.nuget.org/v3/index.json"
        dotnet tool list --global AzureSignTool

    - name: Configure signing environment
      shell: pwsh
      env:
        INPUT_KEY_VAULT_URI: ${{ inputs.key-vault-uri }}
        INPUT_CERTIFICATE_NAME: ${{ inputs.certificate-name }}
      run: |
        $Values = [ordered]@{
          AZURE_KEY_VAULT_URI = $env:INPUT_KEY_VAULT_URI
          AZURE_KEY_VAULT_CERTIFICATE_NAME = $env:INPUT_CERTIFICATE_NAME
        }

        foreach ($Entry in $Values.GetEnumerator()) {
          if ([string]::IsNullOrWhiteSpace($Entry.Value)) {
            throw "The $($Entry.Key) signing value is empty."
          }

          $Delimiter = "AZURE_SIGNING_$([guid]::NewGuid().ToString('N'))"
          "$($Entry.Key)<<$Delimiter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $Entry.Value | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $Delimiter | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

        $AzureSignToolPath = Join-Path $env:USERPROFILE ".dotnet\tools\AzureSignTool.exe"
        if (-not (Test-Path $AzureSignToolPath)) {
          throw "AzureSignTool was not installed at $AzureSignToolPath."
        }

        "AZURE_SIGN_TOOL_PATH=$AzureSignToolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure Swift installer signing command
      if: inputs.swift-installer-scripts-path != ''
      shell: pwsh
      env:
        INPUT_SWIFT_INSTALLER_SCRIPTS_PATH: ${{ inputs.swift-installer-scripts-path }}
      run: |
        $WindowsProjectsPath = Join-Path $env:INPUT_SWIFT_INSTALLER_SCRIPTS_PATH "platforms\Windows"
        $DirectoryBuildPropsPath = Join-Path $WindowsProjectsPath "Directory.Build.props"
        if (-not (Test-Path $DirectoryBuildPropsPath -PathType Leaf)) {
          throw "Could not find the Swift installer build properties at '$DirectoryBuildPropsPath'."
        }
        if ([string]::IsNullOrWhiteSpace($env:USERNAME)) {
          throw "USERNAME is empty. It is required to select the user-specific MSBuild properties file."
        }

        $SignCommand = "`"$env:AZURE_SIGN_TOOL_PATH`" sign --azure-key-vault-url `"%AZURE_KEY_VAULT_URI%`" --azure-key-vault-managed-identity --azure-key-vault-certificate `"%AZURE_KEY_VAULT_CERTIFICATE_NAME%`" --file-digest sha256 --timestamp-rfc3161 `"http://timestamp.digicert.com`" --timestamp-digest sha256 --verbose"
        $EscapedSignCommand = [System.Security.SecurityElement]::Escape($SignCommand)
        $UserProps = @"
        <Project>
          <PropertyGroup>
            <SignCommand>$EscapedSignCommand</SignCommand>
          </PropertyGroup>
        </Project>
        "@
        $UserPropsPath = Join-Path $WindowsProjectsPath "$($env:USERNAME).props"
        [IO.File]::WriteAllText($UserPropsPath, $UserProps, [Text.UTF8Encoding]::new($false))
        Write-Host "Configured the Swift installer signing command in '$UserPropsPath'."

    - name: Authenticate with Azure
      uses: azure/login@v2
      with:
        creds: ${{ inputs.azure-credentials }}

    - name: Download public signing certificate
      shell: pwsh
      env:
        INPUT_KEY_VAULT_URI: ${{ inputs.key-vault-uri }}
        INPUT_CERTIFICATE_NAME: ${{ inputs.certificate-name }}
      run: |
        $CertificateId = "$($env:INPUT_KEY_VAULT_URI.TrimEnd('/'))/certificates/$($env:INPUT_CERTIFICATE_NAME)"
        $CertificatePath = Join-Path $env:RUNNER_TEMP "azure-key-vault-signing-certificate.cer"

        az keyvault certificate download `
          --id $CertificateId `
          --file $CertificatePath `
          --encoding DER `
          --only-show-errors
        if ($LASTEXITCODE -ne 0) {
          throw "Could not download the public signing certificate from Azure Key Vault."
        }

        $Certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($CertificatePath)
        Write-Host "Downloaded Key Vault certificate '$($Certificate.Subject)' with thumbprint '$($Certificate.Thumbprint)'."
        "AZURE_KEY_VAULT_CERTIFICATE_PATH=$CertificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
