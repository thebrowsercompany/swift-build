name: Publish Symbols to R2
description: Uploads PDB files to a public symbol server hosted on R2 using symstore.exe

inputs:
  symbolsFolder:
    description: The path to the folder containing PDB files to upload
    required: true
    type: string
  searchPattern:
    description: The search pattern for PDB files (e.g., '**/*.pdb')
    required: true
    type: string
  swift-version:
    description: The Swift version for symstore metadata
    required: true
    type: string
  arch:
    description: The architecture for symstore metadata (e.g., 'amd64', 'arm64')
    required: true
    type: string
  variant:
    description: The build variant for symstore metadata
    required: false
    type: string
    default: ''
  build-revision:
    description: The swift-build repository revision/hash
    required: true
    type: string
  r2-access-key-id:
    description: R2 access key ID
    required: true
    type: string
  r2-secret-access-key:
    description: R2 secret access key
    required: true
    type: string
  r2-account-id:
    description: R2 account ID
    required: true
    type: string
  r2-bucket:
    description: R2 bucket name
    required: false
    type: string
    default: 'swift-toolchain'

runs:
  using: composite
  steps:
    - name: Install Debugging Tools for Windows
      id: install-debugtools
      shell: pwsh
      run: |
        Write-Output "ℹ️ Downloading Windows SDK installer..."
        # Download Windows SDK for Windows 10 2004 (10.0.19041.0). 
        # See https://learn.microsoft.com/en-us/windows/apps/windows-sdk/downloads for full list.
        Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2120843' -OutFile winsdksetup.exe -UseBasicParsing

        Write-Output "ℹ️ Installing Debugging Tools for Windows..."
        Start-Process -FilePath ".\winsdksetup.exe" `
          -ArgumentList "/features OptionId.WindowsDesktopDebuggers /q /norestart" `
          -Wait

        Write-Output "ℹ️ Installation complete. Searching for symstore.exe..."
        $SymstorePaths = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\symstore.exe",
          "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86\symstore.exe",
          "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\arm64\symstore.exe"
        )

        $SymstoreExe = $SymstorePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
        if ($SymstoreExe) {
          Write-Output "✓ Debugging Tools installed successfully. Found symstore.exe at: $SymstoreExe"
        } else {
          Write-Output "::error::Failed to install Debugging Tools for Windows. symstore.exe not found after installation."
          exit 1
        }
        "symstore-path=$SymstoreExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Add symbols and upload to R2
      shell: pwsh
      env:
        SYMBOLS_FOLDER: ${{ inputs.symbolsFolder }}
        SEARCH_PATTERN: ${{ inputs.searchPattern }}
        SWIFT_VERSION: ${{ inputs.swift-version }}
        ARCH: ${{ inputs.arch }}
        VARIANT: ${{ inputs.variant }}
        BUILD_REVISION: ${{ inputs.build-revision }}
        AWS_ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        AWS_SESSION_TOKEN: '' # required to clear any AWS state was set by sccache
        AWS_SECURITY_TOKEN: '' # required to clear any AWS state was set by sccache
        AWS_REGION: auto
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT_URL: https://${{ inputs.r2-account-id }}.r2.cloudflarestorage.com
        R2_BUCKET: ${{ inputs.r2-bucket }}
        SYMSTORE_EXE: ${{ steps.install-debugtools.outputs.symstore-path }}
      run: |
        $SymstoreExe = $env:SYMSTORE_EXE
        $StorePrefix = 'symbols'

        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false

        $SymbolsPath = (Resolve-Path $env:SYMBOLS_FOLDER).Path
        $SearchPath = Join-Path $SymbolsPath $env:SEARCH_PATTERN
        $PdbFiles = @(Get-ChildItem -Path $SearchPath -Recurse -File)
        if ($PdbFiles.Count -eq 0) {
            Write-Output "::warning::No PDB files found matching $env:SEARCH_PATTERN in $SymbolsPath"
            exit 0
        }
        Write-Output "Found $($PdbFiles.Count) PDB file(s) to publish"

        $TempRoot = Join-Path ([System.IO.Path]::GetTempPath()) "symstore-$(New-Guid)"
        $AdminDir = Join-Path $TempRoot '000Admin'
        $PreviousRefs = Join-Path ([System.IO.Path]::GetTempPath()) "symstore-refs-$(New-Guid)"
        $StoreUri = "s3://$env:R2_BUCKET/$StorePrefix"
        New-Item -ItemType Directory -Path $AdminDir -Force | Out-Null

        try {
            # The calling workflow must serialize this entire action for the store.
            $AdminFiles = @('server.txt', 'history.txt', 'lastid.txt')
            $Downloaded = @(foreach ($Name in $AdminFiles) {
                $Result = & aws s3api get-object `
                    --bucket $env:R2_BUCKET `
                    --key "$StorePrefix/000Admin/$Name" `
                    --endpoint-url $env:R2_ENDPOINT_URL `
                    (Join-Path $AdminDir $Name) 2>&1
                if ($LASTEXITCODE -eq 0) {
                    $Name
                } elseif ("$Result" -notmatch '\((NoSuchKey|404)\)') {
                    throw "Failed to download ${Name}: $Result"
                }
            })
            if ($Downloaded.Count -ne 0 -and $Downloaded.Count -ne $AdminFiles.Count) {
                throw "Incomplete symbol store admin state: found $($Downloaded -join ', ')"
            }
            if ($Downloaded.Count -eq 0) {
                Write-Output "Initializing symbol store at $StoreUri"
            }

            & $SymstoreExe add /r /o /f $SearchPath /s $TempRoot /t 'Swift-Toolchain' `
                /v $env:SWIFT_VERSION /c "$env:BUILD_REVISION $env:ARCH $env:VARIANT"
            if ($LASTEXITCODE) {
                throw "symstore.exe failed ($LASTEXITCODE)"
            }

            # SymStore only saw the local files. Keep earlier transactions' references
            # so deleting one build does not delete a PDB still used by another build.
            foreach ($Refs in Get-ChildItem -Path $TempRoot -Filter refs.ptr -Recurse -File) {
                $Key = [System.IO.Path]::GetRelativePath($TempRoot, $Refs.FullName).Replace('\', '/')
                $Result = & aws s3api get-object `
                    --bucket $env:R2_BUCKET `
                    --key "$StorePrefix/$Key" `
                    --endpoint-url $env:R2_ENDPOINT_URL `
                    $PreviousRefs 2>&1
                if ($LASTEXITCODE) {
                    if ("$Result" -match '\((NoSuchKey|404)\)') { continue }
                    throw "Failed to download ${Key}: $Result"
                }
                $Previous = [System.IO.File]::ReadAllBytes($PreviousRefs)
                $Current = [System.IO.File]::ReadAllBytes($Refs.FullName)
                $Separator = [byte[]] @()
                if ($Previous.Length -gt 0 -and $Previous[-1] -ne 10) {
                    $Separator = [byte[]] @(13, 10)
                }
                [System.IO.File]::WriteAllBytes($Refs.FullName, [byte[]] ($Previous + $Separator + $Current))
            }

            Write-Output "Uploading symbol files to $StoreUri"
            & aws s3 cp $TempRoot "$StoreUri/" `
                --recursive `
                --exclude '000Admin/*' `
                --endpoint-url $env:R2_ENDPOINT_URL `
                --no-progress `
                --only-show-errors `
                --acl private
            if ($LASTEXITCODE) {
                throw 'Failed to upload symbol files to R2'
            }

            & aws s3 cp $AdminDir "$StoreUri/000Admin/" `
                --recursive `
                --exclude 'server.txt' `
                --endpoint-url $env:R2_ENDPOINT_URL `
                --no-progress `
                --only-show-errors `
                --acl private
            if ($LASTEXITCODE) {
                throw 'Failed to upload symbol store admin files to R2'
            }

            # Publish the transaction list after its symbols and transaction files.
            & aws s3 cp (Join-Path $AdminDir 'server.txt') "$StoreUri/000Admin/server.txt" `
                --endpoint-url $env:R2_ENDPOINT_URL `
                --no-progress `
                --only-show-errors `
                --acl private
            if ($LASTEXITCODE) {
                throw 'Failed to upload server.txt to R2'
            }
            Write-Output 'Symbol store uploaded successfully to R2'
        } finally {
            Remove-Item -LiteralPath $TempRoot -Recurse -Force
            if (Test-Path -LiteralPath $PreviousRefs) {
                Remove-Item -LiteralPath $PreviousRefs -Force
            }
        }
