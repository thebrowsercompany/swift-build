name: Test R2 Multipart Uploads

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    runs-on: swift-build-windows-latest-8-cores
    timeout-minutes: 60
    concurrency:
      group: r2-swift-toolchain-symbols-test-symbol-job
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Diagnose multipart uploads of the four failed PDBs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ''
          AWS_SECURITY_TOKEN: ''
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          aws --version
          foreach ($Setting in 's3.preferred_transfer_client', 's3.max_concurrent_requests', 's3.multipart_threshold', 's3.multipart_chunksize', 'retry_mode', 'max_attempts', 'request_checksum_calculation', 'response_checksum_validation') {
            $Value = aws configure get $Setting
            if ($LASTEXITCODE) { $Value = '(unset; CLI default)' }
            Write-Output "${Setting}: $Value"
          }
          $Keys = @(
            'clang.pdb/4525B1FA5B2FAE9B4C4C44205044422E1/clang.pdb',
            'dsymutil.pdb/8566F6F2DA960B864C4C44205044422E1/dsymutil.pdb',
            'llvm-dwarfdump.pdb/CC91C268D201AFD84C4C44205044422E1/llvm-dwarfdump.pdb',
            'llvm-objdump.pdb/FF49E85CFDAF4B7F4C4C44205044422E1/llvm-objdump.pdb'
          )
          New-Item -ItemType Directory -Path multipart-input, diagnostics -Force | Out-Null
          $Hashes = @{}
          foreach ($Key in $Keys) {
            $Path = Join-Path multipart-input $Key
            New-Item -ItemType Directory -Path (Split-Path $Path) -Force | Out-Null
            aws s3 cp "s3://swift-toolchain/symbols-test-symbol-job/$Key" $Path `
              --endpoint-url $env:R2_ENDPOINT_URL --no-progress
            if ($LASTEXITCODE) { throw "Failed to download $Key" }
            $Hashes[$Key] = (Get-FileHash $Path -Algorithm SHA256).Hash
            Write-Output "$Key : $((Get-Item $Path).Length) bytes, SHA256 $($Hashes[$Key])"
          }
          $Failures = 0
          foreach ($Client in 'auto', 'classic') {
            aws configure set default.s3.preferred_transfer_client $Client
            if ($LASTEXITCODE) { throw "Cannot select $Client transfer client" }
            # First pass creates objects; second pass overwrites the same keys.
            foreach ($Pass in 1..2) {
              $Prefix = "symbols-test-symbol-job/multipart-diagnostic/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/$Client"
              $RawLog = Join-Path $env:RUNNER_TEMP "multipart-$Client-$Pass.raw.log"
              $Timer = [Diagnostics.Stopwatch]::StartNew()
              aws s3 cp multipart-input "s3://swift-toolchain/$Prefix/" `
                --recursive --endpoint-url $env:R2_ENDPOINT_URL --no-progress --acl private --debug *> $RawLog
              $UploadExit = $LASTEXITCODE
              $Timer.Stop()
              # Keep multipart tasks, responses, and retries; omit signed request headers.
              Get-Content $RawLog | Where-Object {
                $_ -match ' - (awscli\.customizations\.s3\.factory|s3transfer\.tasks|botocore\.parsers|botocore\.retries\.[^ ]+|botocore\.retryhandler|urllib3\.connectionpool) - DEBUG - |^b[''"]<|\[S3(MetaRequest|Client|Request)\]|^(upload:|upload failed:)'
              } | ForEach-Object {
                $_.Replace($env:AWS_ACCESS_KEY_ID, '[access-key]').Replace($env:AWS_SECRET_ACCESS_KEY, '[secret-key]').Replace(([uri]$env:R2_ENDPOINT_URL).Host, '[R2 host]')
              } | Set-Content "diagnostics/multipart-$Client-$Pass.log"
              Remove-Item $RawLog
              "${Client} pass ${Pass}: upload exit $UploadExit, $([math]::Round($Timer.Elapsed.TotalSeconds, 1)) seconds; $Prefix" |
                Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
              if ($UploadExit) { $Failures++ }
              foreach ($Key in $Keys) {
                aws s3api head-object --bucket swift-toolchain --key "$Prefix/$Key" `
                  --endpoint-url $env:R2_ENDPOINT_URL --query '{Bytes:ContentLength,ETag:ETag}'
                if ($LASTEXITCODE) { $Failures++; continue }
                $Downloaded = Join-Path $env:RUNNER_TEMP 'multipart-roundtrip.pdb'
                aws s3 cp "s3://swift-toolchain/$Prefix/$Key" $Downloaded `
                  --endpoint-url $env:R2_ENDPOINT_URL --no-progress
                if ($LASTEXITCODE) { $Failures++; continue }
                $Matches = (Get-FileHash $Downloaded -Algorithm SHA256).Hash -eq $Hashes[$Key]
                "${Client} pass ${Pass}: $Key SHA256 matches: $Matches" |
                  Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
                if (!$Matches) { $Failures++ }
                Remove-Item $Downloaded
              }
            }
          }
          if ($Failures) { throw "$Failures upload or verification failures" }

      - name: Save multipart diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multipart-diagnostics
          path: diagnostics/*.log
          retention-days: 7
