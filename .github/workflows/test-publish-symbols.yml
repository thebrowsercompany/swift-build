name: Test R2 Symbol Publishing

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    runs-on: swift-build-windows-latest-8-cores
    timeout-minutes: 180
    concurrency:
      group: r2-swift-toolchain-symbols-test-symbol-job
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Check test store and available disk
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ''
          AWS_SECURITY_TOKEN: ''
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          foreach ($Name in 'server.txt', 'history.txt', 'lastid.txt') {
            aws s3api head-object --bucket swift-toolchain `
              --key "symbols-test-symbol-job/000Admin/$Name" `
              --endpoint-url $env:R2_ENDPOINT_URL --query ContentLength --output text
            if ($LASTEXITCODE) { throw "Cannot read test store admin file: $Name" }
          }
          "Source run: 41478561165" >> $env:GITHUB_STEP_SUMMARY
          "Destination: swift-toolchain/symbols-test-symbol-job/" >> $env:GITHUB_STEP_SUMMARY
          "Available disk before download:" >> $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Where-Object Name -Match '^[A-Z]$' | ForEach-Object {
            "- $($_.Name): $([math]::Round($_.Free / 1GB, 2)) GiB free" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Download previous run's symbol artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: thebrowsercompany/swift-build
          run-id: '41478561165'
          pattern: '*-symbols'
          merge-multiple: false
          path: ${{ github.workspace }}/symbols

      - name: Measure downloaded files and available disk
        run: |
          $Artifacts = @(Get-ChildItem -Path symbols -Directory)
          if ($Artifacts.Count -ne 14) {
            throw "Expected 14 symbol artifact directories, found $($Artifacts.Count)"
          }
          $Files = @(Get-ChildItem -Path symbols -Recurse -File)
          foreach ($Group in ($Files | Group-Object Extension)) {
            $Bytes = ($Group.Group | Measure-Object Length -Sum).Sum
            "$($Group.Name): $($Group.Count) files, $([math]::Round($Bytes / 1GB, 2)) GiB" |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "Available disk after download:" >> $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Where-Object Name -Match '^[A-Z]$' | ForEach-Object {
            "- $($_.Name): $([math]::Round($_.Free / 1GB, 2)) GiB free" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload PDBs to test symbol store
        uses: ./.github/actions/publish-symbols-r2
        with:
          symbolsFolder: ${{ github.workspace }}/symbols
          searchPattern: '*.pdb'
          swift-version: '0.0.0'
          arch: all
          build-revision: '0fc8344b4db72c0397fda3b28330ba7152959776'
          r2-bucket: swift-toolchain
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Measure symbol store and remaining disk
        if: always()
        run: |
          $Stores = @(Get-ChildItem -Path $env:TEMP -Directory -Filter 'symstore-*')
          foreach ($Store in $Stores) {
            $Bytes = (Get-ChildItem $Store.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            "SymStore working directory: $([math]::Round($Bytes / 1GB, 2)) GiB" |
              Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "Available disk after publishing:" >> $env:GITHUB_STEP_SUMMARY
          Get-PSDrive -PSProvider FileSystem | Where-Object Name -Match '^[A-Z]$' | ForEach-Object {
            "- $($_.Name): $([math]::Round($_.Free / 1GB, 2)) GiB free" >> $env:GITHUB_STEP_SUMMARY
          }
