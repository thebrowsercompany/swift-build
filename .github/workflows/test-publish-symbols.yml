      swift_asn1_revision: "a54383ada6cecde007d374f58f864e29370ba5c3"
      swift_atomics_revision: "0442cb5a3f98ab802acb777929fdb446bda11a34"
      swift_build_revision: "810f68bbfc13794d267bf488f1e6fa84c267b002"
      swift_certificates_revision: "386001a92200c70fd06217b3ccad58d7226edb84"
      swift_cmark_revision: "0c8947bbd58c491c54aae114aca40621cddc8357"
      swift_cmark_version: "0.29.0.gfm.13"
      swift_collections_revision: "c11818f3cae0780656baa430b49e7f163f08dffd"
      swift_corelibs_foundation_revision: "bd50c2ea233ecc9de1b404d81a8d2186a3b0b332"
      swift_corelibs_libdispatch_revision: "8a2c456a010d995cfa6a9efada08ea40be46b056"
      swift_corelibs_xctest_revision: "80a3f9545d26c43d50ed1e0f377504ae00e759d2"
      swift_crypto_revision: "d79c573e1b400d670ed12c0cb29d33f2c0f5ab70"
      swift_docc_render_artifact_revision: "7546141b16075cdf83a22aff35d60504baae30f8"
      swift_docc_revision: "ada32e135934e0ccbbd6ce5accb8db7c3fe65f9c"
      swift_docc_symbolkit_revision: "e9a4c0f2ddad22ec3e7d1dc8d49061b5bd8a42ea"
      swift_driver_revision: "22e61338191eccac5e4e8aba2a0a7a1da67efc7f"
      swift_experimental_string_processing_revision: "db4678c731724222a8d379f55de3afb91cddaf68"
      swift_format_revision: "b15dd59fad21f1770cdc888b1ca6e2937490001a"
      swift_foundation_revision: "b898bbce74a46ce590791e0a4e3ff181a8b8af25"
      swift_foundation_icu_revision: "e8538d259340dd5b8c261f539f2693d094fe2dac"
      swift_installer_scripts_revision: "ff9989c3ab01ac010521fcf484fffdf71bd8f2f1"
      swift_llbuild_revision: "54a6aca58deb943cc443650482545c58687f5378"
      swift_lmdb_revision: "866bc2563f360a7d84f0e87feb27df23c8958537"
      swift_markdown_revision: "75e3df1d7b664ef3c96595de36c243b98599b3bc"
      swift_package_manager_revision: "1263a5f603ac135ea00d1c74a35fa5144cd2b46a"
      swift_revision: "be45d2d41169b644c282273f8ab828495abef319"
      swift_subprocess_revision: "11633673a41f509f8945f23c96c7acd4adafd679"
      swift_syntax_revision: "e9289aa448b50d48e91832efd6e539f01b9e6f92"
      swift_system_revision: "61e4ca4b81b9e09e2ec863b00c340eb13497dac6"
      swift_testing_revision: "a866d2b21be6b29c48f32a0e3ef067008f1c80fa"
      swift_toolchain_sarif_revision: "9d70de4a3a077b7bf4db18da1ec9884da83d32b1"
