name: Test R2 Symbol Upload

on:
  workflow_dispatch:
    inputs:
      pdb_run_id:
        description: 'Reuse symbol-test-pdbs from a previous test run; leave empty to build'
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

jobs:
  sdk:
    if: inputs.pdb_run_id == ''
    uses: ./.github/workflows/swift-toolchain.yml
    secrets: inherit
    # Inputs from run 35937079538; only the existing Windows amd64 static SDK job runs.
    with:
      build_os: "Windows"
      build_arch: "amd64"
      build_matrix: "{}"
      host_matrix: "{}"
      compilers_matrix: "{}"
      target_matrix: "{}"
      curl_revision: "a05f34973e6c4bb629d018f7cb51487be1c904d8"
      curl_version: "8.9.1"
      ds2_revision: "12ac83f2dc523b8578a094cdc29887066081fae8"
      indexstore_db_revision: "441ead7772cc391e2a0cc8318292bc4aaa8c3a6d"
      libxml2_revision: "2b998a4ffbdfea04fc6a620721abc690a15743af"
      libxml2_version: "2.11.5"
      llvm_project_revision: "c4ee86439ffc5ae7d7c0981c297ba5498861fe41"
      mimalloc_revision: "18b08671c9302247bfb682286e6bf3cc1773f801"
      sourcekit_lsp_revision: "3ae5062da6e1522090b50c4d09b4ef6e2987cfa5"
