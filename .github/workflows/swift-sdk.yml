              'BUILD_SHARED_LIBS' = "YES";
              'CMAKE_INSTALL_BINDIR' = "${{ (matrix.arch == 'amd64' || matrix.arch == 'x86_64') && 'bin64' || matrix.arch == 'arm64' && 'bin64a' || matrix.arch == 'armv7' && 'bin32a' || 'bin32' }}";
              'CMAKE_Swift_FLAGS' = ${{ fromJSON(needs.context.outputs.platform).testing_include_sdk_headers && format('@("-I{0}/usr/include")', env.SDK_ROOT) || '@()' }};
              'SwiftTesting_MACRO' = "${{ github.workspace }}/BinaryCache/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/bin/TestingMacros.dll";
              'SwiftTesting_INSTALL_NESTED_SUBDIR' = "YES";
            }
      - name: Build Testing
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/Testing
      - name: Install Testing
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/Testing --target install

      # build.ps1: Build-SDK -> Build-XCTest (shared SDK only).
      # TODO(compnerd) correctly version XCTest
      - name: Configure XCTest
        if: ${{ !matrix.static }}
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: XCTest
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-corelibs-xctest
          bin-dir: ${{ github.workspace }}/BinaryCache/XCTest
          install-dir: ${{ env.PLATFORM_ROOT }}/Developer/Library/XCTest-${{ needs.context.outputs.swift_version }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          swift-compiler: 'Stage1.Swift'
          swift-sdk-path: ${{ env.SDK_ROOT }}
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "YES";
              'CMAKE_INSTALL_BINDIR' = "${{ (matrix.arch == 'amd64' || matrix.arch == 'x86_64') && 'bin64' || matrix.arch == 'arm64' && 'bin64a' || matrix.arch == 'armv7' && 'bin32a' || 'bin32' }}";
              'CMAKE_Swift_FLAGS' = ${{ fromJSON(needs.context.outputs.platform).testing_include_sdk_headers && format('@("-I{0}/usr/include")', env.SDK_ROOT) || '@()' }};
              'ENABLE_TESTING' = "NO";
              'XCTest_INSTALL_NESTED_SUBDIR' = "YES";
              'SwiftTesting_DIR' = "${{ github.workspace }}/BinaryCache/Testing/cmake/modules";
            }
      - name: Build XCTest
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/XCTest
      - name: Install XCTest
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/XCTest --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-${{ matrix.static && 'static' || 'shared' }}-sdk
          path: ${{ env.PLATFORM_ROOT }}

      - name: Upload files for symbol publishing
        if: ${{ fromJSON(needs.context.outputs.platform).publish_symbols && fromJSON(needs.context.outputs.debug_info) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-${{ matrix.static && 'static' || 'shared' }}-sdk-symbols
          path: |
            ${{ github.workspace }}/BinaryCache/**/*.pdb
            ${{ github.workspace }}/BinaryCache/**/*.dll
          compression-level: 1
          if-no-files-found: warn
