name: Swift SDK build
description: |
  Workflow to build a Swift SDK for one platform on a Windows build machine.

on:
  workflow_call:
    inputs:
      context:
        description: JSON object with the inputs of the calling workflow.
        required: true
        type: string
      platform:
        description: Name of a file in `.github/sdk-platforms/` (without `.json`).
        required: true
        type: string

# TODO: Pass this as input once the build and swift toolchain workflows are merged.
env:
  CMAKE_VERSION: 4.4.1

defaults:
  run:
    shell: pwsh

jobs:
  context:
    name: Context
    runs-on: ubuntu-latest
    outputs:
      brotli_revision: ${{ fromJSON(inputs.context).brotli_revision }}
      brotli_version: ${{ fromJSON(inputs.context).brotli_version }}
      build_arch: ${{ fromJSON(inputs.context).build_arch }}
      ci_build_revision: ${{ fromJSON(inputs.context).ci_build_revision }}
      curl_revision: ${{ fromJSON(inputs.context).curl_revision }}
      curl_version: ${{ fromJSON(inputs.context).curl_version }}
      debug_info: ${{ fromJSON(inputs.context).debug_info }}
      default_build_runner: ${{ fromJSON(inputs.context).default_build_runner }}
      ds2_revision: ${{ fromJSON(inputs.context).ds2_revision }}
      libxml2_revision: ${{ fromJSON(inputs.context).libxml2_revision }}
      libxml2_version: ${{ fromJSON(inputs.context).libxml2_version }}
      llvm_project_revision: ${{ fromJSON(inputs.context).llvm_project_revision }}
      python_version: ${{ fromJSON(inputs.context).python_version }}
      swift_collections_revision: ${{ fromJSON(inputs.context).swift_collections_revision }}
      swift_corelibs_foundation_revision: ${{ fromJSON(inputs.context).swift_corelibs_foundation_revision }}
      swift_corelibs_libdispatch_revision: ${{ fromJSON(inputs.context).swift_corelibs_libdispatch_revision }}
      swift_corelibs_xctest_revision: ${{ fromJSON(inputs.context).swift_corelibs_xctest_revision }}
      swift_experimental_string_processing_revision: ${{ fromJSON(inputs.context).swift_experimental_string_processing_revision }}
      swift_foundation_icu_revision: ${{ fromJSON(inputs.context).swift_foundation_icu_revision }}
      swift_foundation_revision: ${{ fromJSON(inputs.context).swift_foundation_revision }}
      swift_revision: ${{ fromJSON(inputs.context).swift_revision }}
      swift_testing_revision: ${{ fromJSON(inputs.context).swift_testing_revision }}
      swift_version: ${{ fromJSON(inputs.context).swift_version }}
      zlib_revision: ${{ fromJSON(inputs.context).zlib_revision }}
      zlib_version: ${{ fromJSON(inputs.context).zlib_version }}

      # Resolved from `.github/sdk-platforms/<platform>.json`.
      platform: ${{ steps.platform.outputs.platform }}
      os: ${{ steps.platform.outputs.os }}
      arch_matrix: ${{ steps.platform.outputs.arch_matrix }}
      sdk_matrix: ${{ steps.platform.outputs.sdk_matrix }}
      c_compiler: ${{ steps.platform.outputs.c_compiler }}
      cxx_compiler: ${{ steps.platform.outputs.cxx_compiler }}
      zlib_library: ${{ steps.platform.outputs.zlib_library }}
      brotlicommon_library: ${{ steps.platform.outputs.brotlicommon_library }}
      brotlidec_library: ${{ steps.platform.outputs.brotlidec_library }}
      android_api_level: ${{ steps.platform.outputs.android_api_level }}
      android_clang_version: ${{ steps.platform.outputs.android_clang_version }}
    steps:
      - name: Show context
        env:
          CONTEXT: ${{ inputs.context }}
        run: $env:CONTEXT | ConvertFrom-Json | ConvertTo-Json -Depth 4

      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ fromJSON(inputs.context).ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          sparse-checkout: .github/sdk-platforms
          show-progress: false

      - name: Resolve platform
        id: platform
        env:
          CONTEXT: ${{ inputs.context }}
          PLATFORM_NAME: ${{ inputs.platform }}
        run: |
          $Context = $env:CONTEXT | ConvertFrom-Json -AsHashtable
          $Path = "${{ github.workspace }}/SourceCache/ci-build/.github/sdk-platforms/$env:PLATFORM_NAME.json"
          if (-not (Test-Path $Path)) { throw "Unknown SDK platform '$env:PLATFORM_NAME' ($Path)" }

          # Expand `{{KEY}}` placeholders from the calling workflow's inputs
          # (e.g. `{{ANDROID_API_LEVEL}}`).
          $Text = (Get-Content -Raw $Path) -replace '\{\{(\w+)\}\}', {
            $Key = $_.Groups[1].Value
            if (-not $Context.ContainsKey($Key)) { throw "Unknown placeholder '$($_.Value)' in $Path" }
            "$($Context[$Key])"
          }
          $Platform = $Text | ConvertFrom-Json -AsHashtable

          $SDKMatrix = @(foreach ($Variant in $Platform.variants) {
            foreach ($Arch in $Platform.archs) {
              $Entry = $Arch.Clone()
              $Entry.static = ($Variant -eq 'static')
              $Entry
            }
          })

          function Set-Output([string] $Name, [string] $Value) {
            "$Name=$Value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          Set-Output platform ($Platform | ConvertTo-Json -Depth 8 -Compress)
          Set-Output os $Platform.name
          Set-Output arch_matrix (@{ include = @($Platform.archs) } | ConvertTo-Json -Depth 8 -Compress)
          Set-Output sdk_matrix (@{ include = $SDKMatrix } | ConvertTo-Json -Depth 8 -Compress)
          Set-Output c_compiler $Platform.compilers.c
          Set-Output cxx_compiler $Platform.compilers.cxx
          Set-Output zlib_library $Platform.libraries.zlib
          Set-Output brotlicommon_library $Platform.libraries.brotlicommon
          Set-Output brotlidec_library $Platform.libraries.brotlidec
          Set-Output android_api_level $Platform.configure.android_api_level
          Set-Output android_clang_version $Platform.configure.android_clang_version

  compiler-runtime:
    needs: [context]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} Compiler Runtime

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}

      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      # The stage1 compiler always comes from the Windows build host.
      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: swiftlang/llvm-project
          ref: ${{ needs.context.outputs.llvm_project_revision }}
          path: ${{ github.workspace }}/SourceCache/llvm-project
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.context.outputs.python_version }}
          architecture: x64 # FIXME(#1004): Remove workaround installing x64 Python on ARM64 CI hosts

      - name: Configure Compiler Runtime LLVM
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Compiler Runtime LLVM
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/llvm-project/llvm
          bin-dir: ${{ github.workspace }}/BinaryCache/compiler-runtime-llvm
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          assembler: 'Stage1'
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'LLVM_ENABLE_ASSERTIONS' = "YES";
              'LLVM_HOST_TRIPLE' = "${{ matrix.triple }}";
            }

      - name: Get LLVM major version
        id: llvm-version
        run: |
          $LLVMConfigVersion = "${{ github.workspace }}/BinaryCache/compiler-runtime-llvm/lib/cmake/llvm/LLVMConfigVersion.cmake"
          $Version = Select-String -Path $LLVMConfigVersion -Pattern 'set\(PACKAGE_VERSION "([0-9]+)\.'
          if (-not $Version) {
            throw "Could not read the LLVM version from $LLVMConfigVersion"
          }
          "major=$($Version.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # build.ps1: Build-CompilerRuntime
      - name: Configure Compiler Runtime Builtins
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Compiler Runtime Builtins
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/llvm-project/compiler-rt/lib/builtins
          bin-dir: ${{ github.workspace }}/BinaryCache/compiler-runtime-builtins
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/lib/clang/${{ steps.llvm-version.outputs.major }}
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          assembler: 'Stage1'
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'LLVM_DIR' = "${{ github.workspace }}/BinaryCache/compiler-runtime-llvm/lib/cmake/llvm";
              'LLVM_ENABLE_PER_TARGET_RUNTIME_DIR' = "YES";
              'COMPILER_RT_DEFAULT_TARGET_ONLY' = "YES";
            }
      - name: Install Compiler Runtime Builtins
        run: cmake --build ${{ github.workspace }}/BinaryCache/compiler-runtime-builtins --target install-compiler-rt

      - name: Configure Compiler Runtime
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Compiler Runtime
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/llvm-project/compiler-rt
          bin-dir: ${{ github.workspace }}/BinaryCache/compiler-runtime
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/lib/clang/${{ steps.llvm-version.outputs.major }}
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          assembler: 'Stage1'
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'LLVM_DIR' = "${{ github.workspace }}/BinaryCache/compiler-runtime-llvm/lib/cmake/llvm";
              'LLVM_ENABLE_PER_TARGET_RUNTIME_DIR' = "YES";
              'COMPILER_RT_DEFAULT_TARGET_ONLY' = "YES";
              'COMPILER_RT_BUILD_BUILTINS' = "NO";
              'COMPILER_RT_BUILD_CRT' = "NO";
              'COMPILER_RT_BUILD_LIBFUZZER' = "NO";
              'COMPILER_RT_BUILD_ORC' = "NO";
              'COMPILER_RT_BUILD_XRAY' = "NO";
              'COMPILER_RT_BUILD_PROFILE' = "YES";
              'COMPILER_RT_BUILD_SANITIZERS' = "YES";
            }
      - name: Install Compiler Runtime
        run: cmake --build ${{ github.workspace }}/BinaryCache/compiler-runtime --target install-compiler-rt

      - name: Upload Compiler Runtime
        uses: thebrowsercompany/gha-upload-tar-artifact@e18c33b1cd416d0d96a91dc6dce06219f98e4e27 # main
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-compiler-runtime
          path: ${{ github.workspace }}/BuildRoot/Library

  zlib:
    needs: [context]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} zlib

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: madler/zlib
          ref: ${{ needs.context.outputs.zlib_revision }}
          path: ${{ github.workspace }}/SourceCache/zlib
          show-progress: false

      # build.ps1: Build-Zlib
      - name: Configure zlib
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: zlib
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/zlib
          bin-dir: ${{ github.workspace }}/BinaryCache/zlib-${{ needs.context.outputs.zlib_version }}
          install-dir: ${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'CMAKE_POSITION_INDEPENDENT_CODE' = "YES";
              'ZLIB_BUILD_MINIZIP' = "NO";
              'ZLIB_BUILD_SHARED' = "NO";
              'ZLIB_BUILD_STATIC' = "YES";
              'ZLIB_BUILD_TESTING' = "NO";
            }
      - name: Build zlib
        run: cmake --build ${{ github.workspace }}/BinaryCache/zlib-${{ needs.context.outputs.zlib_version }}
      - name: Install zlib
        run: cmake --build ${{ github.workspace }}/BinaryCache/zlib-${{ needs.context.outputs.zlib_version }} --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-zlib-${{ needs.context.outputs.zlib_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr

  brotli:
    needs: [context]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} brotli

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: google/brotli
          ref: ${{ needs.context.outputs.brotli_revision }}
          path: ${{ github.workspace }}/SourceCache/brotli
          show-progress: false

      # build.ps1: Build-Brotli
      - name: Configure brotli
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: brotli
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/brotli
          bin-dir: ${{ github.workspace }}/BinaryCache/brotli-${{ needs.context.outputs.brotli_version }}
          install-dir: ${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "NO";
              'CMAKE_POSITION_INDEPENDENT_CODE' = "YES";
            }
      - name: Build brotli
        run: cmake --build ${{ github.workspace }}/BinaryCache/brotli-${{ needs.context.outputs.brotli_version }}
      - name: Install brotli
        run: cmake --build ${{ github.workspace }}/BinaryCache/brotli-${{ needs.context.outputs.brotli_version }} --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-brotli-${{ needs.context.outputs.brotli_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr

  curl:
    needs: [context, zlib, brotli]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} curl

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: curl/curl
          ref: ${{ needs.context.outputs.curl_revision }}
          path: ${{ github.workspace }}/SourceCache/curl
          show-progress: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-zlib-${{ needs.context.outputs.zlib_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-brotli-${{ needs.context.outputs.brotli_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr

      # build.ps1: Build-Curl
      - name: Configure curl
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: curl
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/curl
          bin-dir: ${{ github.workspace }}/BinaryCache/curl-${{ needs.context.outputs.curl_version }}
          install-dir: ${{ github.workspace }}/BuildRoot/Library/curl-${{ needs.context.outputs.curl_version }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "NO";
              'BUILD_TESTING' = "NO";
              'CMAKE_POSITION_INDEPENDENT_CODE' = "YES";
              'BROTLI_INCLUDE_DIR' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/include";
              'BROTLICOMMON_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/lib/${{ needs.context.outputs.brotlicommon_library }}";
              'BROTLIDEC_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/lib/${{ needs.context.outputs.brotlidec_library }}";
              'BUILD_CURL_EXE' = "NO";
              'BUILD_LIBCURL_DOCS' = "NO";
              'BUILD_MISC_DOCS' = "NO";
              'CURL_CA_BUNDLE' = "none";
              'CURL_CA_FALLBACK' = "NO";
              'CURL_CA_PATH' = "none";
              'CURL_BROTLI' = "YES";
              'CURL_DISABLE_ALTSVC' = "NO";
              'CURL_DISABLE_AWS' = "YES";
              'CURL_DISABLE_BASIC_AUTH' = "NO";
              'CURL_DISABLE_BEARER_AUTH' = "NO";
              'CURL_DISABLE_BINDLOCAL' = "NO";
              'CURL_DISABLE_COOKIES' = "NO";
              'CURL_DISABLE_DICT' = "YES";
              'CURL_DISABLE_DIGEST_AUTH' = "NO";
              'CURL_DISABLE_DOH' = "NO";
              'CURL_DISABLE_FILE' = "YES";
              'CURL_DISABLE_FORM_API' = "NO";
              'CURL_DISABLE_FTP' = "YES";
              'CURL_DISABLE_GETOPTIONS' = "NO";
              'CURL_DISABLE_GOPHER' = "YES";
              'CURL_DISABLE_HEADERS_API' = "YES";
              'CURL_DISABLE_HSTS' = "NO";
              'CURL_DISABLE_HTTP' = "NO";
              'CURL_DISABLE_HTTP_AUTH' = "NO";
              'CURL_DISABLE_IMAP' = "YES";
              'CURL_DISABLE_KERBEROS_AUTH' = "NO";
              'CURL_DISABLE_LDAP' = "YES";
              'CURL_DISABLE_LDAPS' = "YES";
              'CURL_DISABLE_MIME' = "NO";
              'CURL_DISABLE_MQTT' = "YES";
              'CURL_DISABLE_NEGOTIATE_AUTH' = "NO";
              'CURL_DISABLE_NETRC' = "NO";
              'CURL_DISABLE_NTLM' = "NO";
              'CURL_DISABLE_PARSEDATE' = "NO";
              'CURL_DISABLE_POP3' = "YES";
              'CURL_DISABLE_PROGRESS_METER' = "YES";
              'CURL_DISABLE_PROXY' = "NO";
              'CURL_DISABLE_RTSP' = "YES";
              'CURL_DISABLE_SHUFFLE_DNS' = "YES";
              'CURL_DISABLE_SMB' = "YES";
              'CURL_DISABLE_SMTP' = "YES";
              'CURL_DISABLE_SOCKETPAIR' = "YES";
              'CURL_DISABLE_SRP' = "NO";
              'CURL_DISABLE_TELNET' = "YES";
              'CURL_DISABLE_TFTP' = "YES";
              'CURL_DISABLE_VERBOSE_STRINGS' = "NO";
              'CURL_LTO' = "NO";
              'CURL_USE_BEARSSL' = "NO";
              'CURL_USE_GNUTLS' = "NO";
              'CURL_USE_GSSAPI' = "NO";
              'CURL_USE_LIBPSL' = "NO";
              'CURL_USE_LIBSSH' = "NO";
              'CURL_USE_LIBSSH2' = "NO";
              'CURL_USE_MBEDTLS' = "NO";
              'CURL_USE_OPENSSL' = "NO";
              'CURL_USE_SCHANNEL' = "${{ fromJSON(needs.context.outputs.platform).curl.CURL_USE_SCHANNEL }}";
              'CURL_USE_WOLFSSL' = "NO";
              'CURL_WINDOWS_SSPI' = "${{ fromJSON(needs.context.outputs.platform).curl.CURL_WINDOWS_SSPI }}";
              'CURL_ZLIB' = "YES";
              'CURL_ZSTD' = "NO";
              'ENABLE_ARES' = "NO";
              'ENABLE_CURLDEBUG' = "NO";
              'ENABLE_CURL_MANUAL' = "NO";
              'ENABLE_DEBUG' = "NO";
              'ENABLE_IPV6' = "YES";
              'ENABLE_THREADED_RESOLVER' = "NO";
              'ENABLE_UNICODE' = "YES";
              'ENABLE_UNIX_SOCKETS' = "NO";
              'ENABLE_WEBSOCKETS' = "YES";
              'HAVE_POLL_FINE' = "NO";
              'USE_ECH' = "NO";
              'USE_HTTPSRR' = "NO";
              'USE_IDN2' = "NO";
              'USE_MSH3' = "NO";
              'USE_NGHTTP2' = "NO";
              'USE_NGTCP2' = "NO";
              'USE_QUICHE' = "NO";
              'USE_OPENSSL_QUIC' = "NO";
              'USE_WIN32_IDN' = "${{ fromJSON(needs.context.outputs.platform).curl.USE_WIN32_IDN }}";
              'USE_WIN32_LARGE_FILES' = "${{ fromJSON(needs.context.outputs.platform).curl.USE_WIN32_LARGE_FILES }}";
              'USE_WIN32_LDAP' = "NO";
              'ZLIB_ROOT' = "${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr";
              'ZLIB_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr/lib/${{ needs.context.outputs.zlib_library }}";
            }
      - name: Build curl
        run: cmake --build ${{ github.workspace }}/BinaryCache/curl-${{ needs.context.outputs.curl_version }}
      - name: Install curl
        run: cmake --build ${{ github.workspace }}/BinaryCache/curl-${{ needs.context.outputs.curl_version }} --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-curl-${{ needs.context.outputs.curl_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/curl-${{ needs.context.outputs.curl_version }}/usr

  libxml2:
    needs: [context]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} libxml2

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: gnome/libxml2
          ref: ${{ needs.context.outputs.libxml2_revision }}
          path: ${{ github.workspace }}/SourceCache/libxml2
          show-progress: false

      # build.ps1: Build-XML2
      - name: Configure libxml2
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: libxml2
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/libxml2
          bin-dir: ${{ github.workspace }}/BinaryCache/libxml2-${{ needs.context.outputs.libxml2_version }}
          install-dir: ${{ github.workspace }}/BuildRoot/Library/libxml2-${{ needs.context.outputs.libxml2_version }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "NO";
              'CMAKE_POSITION_INDEPENDENT_CODE' = "YES";
              'LIBXML2_WITH_ICONV' = "NO";
              'LIBXML2_WITH_ICU' = "NO";
              'LIBXML2_WITH_LZMA' = "NO";
              'LIBXML2_WITH_PYTHON' = "NO";
              'LIBXML2_WITH_TESTS' = "NO";
              'LIBXML2_WITH_THREADS' = "YES";
              'LIBXML2_WITH_ZLIB' = "NO";
            }
      - name: Build libxml2
        run: cmake --build ${{ github.workspace }}/BinaryCache/libxml2-${{ needs.context.outputs.libxml2_version }}
      - name: Install libxml2
        run: cmake --build ${{ github.workspace }}/BinaryCache/libxml2-${{ needs.context.outputs.libxml2_version }} --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-libxml2-${{ needs.context.outputs.libxml2_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/libxml2-${{ needs.context.outputs.libxml2_version }}/usr

  ds2:
    needs: [context]
    if: fromJSON(needs.context.outputs.platform).ds2
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.arch_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} ds2

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: compnerd/ds2
          ref: ${{ needs.context.outputs.ds2_revision }}
          path: ${{ github.workspace }}/SourceCache/ds2
          show-progress: false

      # TODO(issues/205): Preload Chocolatey package manager on Azure images so we can remove this step.
      - uses: andrurogerz/ensure-chocolatey@v1

      - name: Install Flex and Bison Tools
        run: choco install winflexbison3

      # RegsGen2 is a host tool built once by the calling workflow.
      - uses: actions/download-artifact@v4
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-regsgen2
          path: ${{ github.workspace }}/BinaryCache/RegsGen2

      # build.ps1: Build-DS2
      - name: Configure DS2
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: DS2
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/ds2
          bin-dir: ${{ github.workspace }}/BinaryCache/ds2
          install-dir: ${{ github.workspace }}/BinaryCache/Library/Developer/ds2/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'DS2_REGSGEN2' = "${{ github.workspace }}/BinaryCache/RegsGen2/regsgen2.exe";
              'DS2_PROGRAM_PREFIX' = "${{ matrix.ds2_program_prefix }}";
            }
      - name: Build DS2
        run: cmake --build ${{ github.workspace }}/BinaryCache/ds2
      - name: Install DS2
        run: cmake --build ${{ github.workspace }}/BinaryCache/ds2 --target install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-ds2
          path: ${{ github.workspace }}/BinaryCache/Library/Developer

  sdk:
    needs: [context, curl, libxml2]
    runs-on: ${{ needs.context.outputs.default_build_runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.sdk_matrix) }}

    name: ${{ needs.context.outputs.os }} ${{ matrix.arch }} ${{ matrix.static && 'static' || 'shared' }} SDK

    env:
      PLATFORM_ROOT: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/${{ needs.context.outputs.os }}.platform
      SDK_ROOT: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/${{ needs.context.outputs.os }}.platform/Developer/SDKs/${{ needs.context.outputs.os }}.sdk

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.context.outputs.ci_build_revision }}
          path: ${{ github.workspace }}/SourceCache/ci-build
          show-progress: false
      - uses: ./SourceCache/ci-build/.github/actions/setup-sdk-platform
        id: platform
        with:
          platform: ${{ needs.context.outputs.platform }}
          host-arch: ${{ matrix.arch }}
      - name: Install CMake ${{ env.CMAKE_VERSION }}
        uses: lukka/get-cmake@4a7d025fc60f00db0c7b44ebf783d19b52444830 # v4.4.1
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.context.outputs.python_version }}
          architecture: x64 # FIXME(#1004): Remove workaround installing x64 Python on ARM64 CI hosts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-libxml2-${{ needs.context.outputs.libxml2_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/libxml2-${{ needs.context.outputs.libxml2_version }}/usr
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-curl-${{ needs.context.outputs.curl_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/curl-${{ needs.context.outputs.curl_version }}/usr
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-zlib-${{ needs.context.outputs.zlib_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-brotli-${{ needs.context.outputs.brotli_version }}
          path: ${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr

      # The stage1 compiler and bootstrap macros always come from the Windows build host.
      - name: Download Stage1 Compiler
        uses: thebrowsercompany/gha-download-tar-artifact@59992d91335d4ecba543c8535f7d07238e42125d # main
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-stage1-compiler
          path: ${{ github.workspace }}/BinaryCache/stage1/Library
      - uses: actions/download-artifact@v4
        with:
          name: Windows-${{ needs.context.outputs.build_arch }}-bootstrap-macros
          path: ${{ github.workspace }}/BinaryCache/Library

      - uses: actions/checkout@v4.2.2
        with:
          repository: swiftlang/swift
          ref: ${{ needs.context.outputs.swift_revision }}
          path: ${{ github.workspace }}/SourceCache/swift
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: swiftlang/llvm-project
          ref: ${{ needs.context.outputs.llvm_project_revision }}
          path: ${{ github.workspace }}/SourceCache/llvm-project
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: apple/swift-collections
          ref: ${{ needs.context.outputs.swift_collections_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-collections
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: apple/swift-corelibs-libdispatch
          ref: ${{ needs.context.outputs.swift_corelibs_libdispatch_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-corelibs-libdispatch
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: swiftlang/swift-corelibs-foundation
          ref: ${{ needs.context.outputs.swift_corelibs_foundation_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-corelibs-foundation
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: apple/swift-foundation
          ref: ${{ needs.context.outputs.swift_foundation_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-foundation
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: apple/swift-foundation-icu
          ref: ${{ needs.context.outputs.swift_foundation_icu_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-foundation-icu
          show-progress: false
      - uses: actions/checkout@v4.2.2
        with:
          repository: swiftlang/swift-experimental-string-processing
          ref: ${{ needs.context.outputs.swift_experimental_string_processing_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-experimental-string-processing
          show-progress: false
      - uses: actions/checkout@v4.2.2
        if: ${{ !matrix.static }}
        with:
          repository: swiftlang/swift-testing
          ref: ${{ needs.context.outputs.swift_testing_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-testing
          show-progress: false
      - uses: actions/checkout@v4.2.2
        if: ${{ !matrix.static }}
        with:
          repository: swiftlang/swift-corelibs-xctest
          ref: ${{ needs.context.outputs.swift_corelibs_xctest_revision }}
          path: ${{ github.workspace }}/SourceCache/swift-corelibs-xctest
          show-progress: false

      - name: Add Stage1 runtime to PATH
        run: |
          $RTLPath = cygpath -w ${{ github.workspace }}/BinaryCache/stage1/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/bin
          echo ${RTLPath} | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Resync
        run: |
          cd ${{ github.workspace }}/SourceCache/swift/Runtimes
          cmake -P Resync.cmake

      # build.ps1: Build-CDispatch
      - name: Configure CDispatch
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: libdispatch-c
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-corelibs-libdispatch
          bin-dir: ${{ github.workspace }}/BinaryCache/libdispatch-c
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: ${{ needs.context.outputs.c_compiler }}
          cxx-compiler: ${{ needs.context.outputs.cxx_compiler }}
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "YES";
              'BUILD_TESTING' = "NO";
              'ENABLE_SWIFT' = "NO";
            }
      - name: Build CDispatch
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/libdispatch-c

      - name: Upload Host CDispatch
        uses: thebrowsercompany/gha-upload-tar-artifact@e18c33b1cd416d0d96a91dc6dce06219f98e4e27 # main
        if: ${{ matrix.upload_host_cdispatch && !matrix.static }}
        with:
          name: ${{ needs.context.outputs.os }}-${{ matrix.arch }}-cdispatch
          path: ${{ github.workspace }}/BinaryCache/libdispatch-c

      # build.ps1: Build-SDK
      - name: Configure Runtime
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Runtime
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift/Runtimes/Core
          bin-dir: ${{ github.workspace }}/BinaryCache/Runtime
          install-dir: ${{ env.SDK_ROOT }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          cmake-defines: |
            @{
              'SWIFT_PUBLIC_KEY_TOKEN' = "0000000000000000";
              'SWIFT_ASSEMBLY_VERSION' = "${{ needs.context.outputs.swift_version }}";
              'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
              'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
              'dispatch_DIR' = "${{ github.workspace }}/BinaryCache/libdispatch-c/cmake/modules";
              # FIXME(hjyamauchi) Should dynamic to libdispatch https://github.com/swiftlang/swift/issues/87548
              'CMAKE_CXX_FLAGS' = ${{ matrix.static && '@("-Ddispatch_STATIC")' || '@()' }};
              'CMAKE_Swift_FLAGS' = ${{ matrix.static && '@("-Xcc", "-static-libclosure")' || '@()' }};
              # FIXME(compnerd) remove this once the default option is flipped to `ON`.
              'SwiftCore_ENABLE_BACKTRACING' = "YES";
              # FIXME(compnerd) remove this once the default option is flipped to `ON`.
              'SwiftCore_ENABLE_CONCURRENCY' = "YES";
              # FIXME(compnerd) remove this once the default option is flipped to `ON`.
              'SwiftCore_ENABLE_REMOTE_MIRROR' = "YES";
              # FIXME(compnerd) this currently causes a build failure on Windows, but
              # this should be enabled when building the dynamic runtime.
              'SwiftCore_ENABLE_LIBRARY_EVOLUTION' = "NO";
            }
      - name: Build Runtime
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Runtime
      - name: Install Runtime
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Runtime --target install

      # build.ps1: Build-SDK
      - name: Configure Overlay
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Overlay
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift/Runtimes/Overlay
          bin-dir: ${{ github.workspace }}/BinaryCache/Overlay
          install-dir: ${{ env.SDK_ROOT }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          cmake-defines: |
            @{
              'SWIFT_PUBLIC_KEY_TOKEN' = "0000000000000000";
              'SWIFT_ASSEMBLY_VERSION' = "${{ needs.context.outputs.swift_version }}";
              'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
              'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
              'SwiftCore_DIR' = "${{ github.workspace }}/BinaryCache/Runtime/cmake/SwiftCore";
              # FIXME(compnerd) this currently causes a build failure on Windows, but
              # this should be enabled when building the dynamic runtime.
              'SwiftOverlay_ENABLE_LIBRARY_EVOLUTION' = "NO";
              'SwiftOverlay_ENABLE_CXX_INTEROP' = "YES";
            }
      - name: Build Overlay
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Overlay
      - name: Install Overlay
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Overlay --target install

      # build.ps1: Build-SDK
      - name: Configure String Processing
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: StringProcessing
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift/Runtimes/Supplemental/StringProcessing
          bin-dir: ${{ github.workspace }}/BinaryCache/StringProcessing
          install-dir: ${{ env.SDK_ROOT }}/usr
          android-api-level: ${{ needs.context.outputs.android_api_level }}
          android-clang-version: ${{ needs.context.outputs.android_clang_version }}
          ndk-path: ${{ steps.platform.outputs.ndk-path }}
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          cmake-defines: |
            @{
              'SWIFT_PUBLIC_KEY_TOKEN' = "0000000000000000";
              'SWIFT_ASSEMBLY_VERSION' = "${{ needs.context.outputs.swift_version }}";
              'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
              'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
              'SwiftCore_DIR' = "${{ github.workspace }}/BinaryCache/Runtime/cmake/SwiftCore";
              # FIXME(compnerd) this currently causes a build failure on Windows, but
              # this should be enabled when building the dynamic runtime.
              'SwiftStringProcessing_ENABLE_LIBRARY_EVOLUTION' = "NO";
            }
      - name: Build String Processing
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/StringProcessing
      - name: Install String Processing
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/StringProcessing --target install

      # build.ps1: Build-SDK
      - name: Configure Synchronization
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Synchronization
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: ${{ needs.context.outputs.os }}
          arch: ${{ matrix.arch }}
