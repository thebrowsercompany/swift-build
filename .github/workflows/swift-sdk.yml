            with open(os.path.normpath(info_plist), 'wb') as plist:
              # TODO(compnerd) derive this from the install directory
              plistlib.dump({ 'DefaultProperties': { 'XCTEST_VERSION': '${{ needs.context.outputs.swift_version }}', 'SWIFT_TESTING_VERSION': '${{ needs.context.outputs.swift_version }}', 'SWIFTC_FLAGS': ['-use-ld=lld'] } }, plist)

      - name: Write SDK Settings
        env:
          PLATFORM: ${{ needs.context.outputs.platform }}
        run: |
          $Platform = $env:PLATFORM | ConvertFrom-Json
          $Name = $Platform.canonical_name
          $SDKSettings = @{
            CanonicalName = $Name
            DisplayName = $Platform.name
            IsBaseSDK = "YES"
            Version = "${{ needs.context.outputs.swift_version }}"
            VersionMap = @{}
            HeaderSearchPaths = @( "usr/include" )
            LibrarySearchPaths = @()
            DefaultProperties = @{
              PLATFORM_NAME = $Name
            }
            SupportedTargets = @{
              $Name = @{
                PlatformFamilyDisplayName = $Platform.name
                PlatformFamilyName = $Platform.name
                Archs = @("$(("${{ matrix.triple }}" -split '-')[0])")
                LLVMTargetVendor = $Platform.sdk_settings.llvm_target_vendor
                LLVMTargetSys = $Platform.sdk_settings.llvm_target_sys
                LLVMTargetTripleEnvironment = $Platform.sdk_settings.llvm_target_environment
              }
            }
          }
          foreach ($Property in $Platform.sdk_settings.default_properties.PSObject.Properties) {
            $SDKSettings.DefaultProperties[$Property.Name] = $Property.Value
          }
          New-Item -ItemType Directory -Path "${{ env.SDK_ROOT }}" -Force | Out-Null
          $SDKSettings | ConvertTo-JSON -Depth 4 | Out-File -FilePath "${{ env.SDK_ROOT }}/SDKSettings.json"

          $PListFile = "${{ env.SDK_ROOT }}/SDKSettings.plist"
          python3 -c "import plistlib; print(str(plistlib.dumps($(($SDKSettings | ConvertTo-JSON -Compress -Depth 4) -replace '"', "'")), encoding='utf-8'))" | Out-File -FilePath $PListFile -Encoding utf8

