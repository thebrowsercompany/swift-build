          bin-dir: ${{ github.workspace }}/BinaryCache/Differentiation
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr
          c-compiler: 'Stage1.GNUC'
