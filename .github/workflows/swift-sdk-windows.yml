          src-dir: ${{ github.workspace }}/SourceCache/swift/Runtimes/Supplemental/Runtime
          bin-dir: ${{ github.workspace }}/BinaryCache/RuntimeModule
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          cmake-defines: |
            @{
              'SWIFT_PUBLIC_KEY_TOKEN' = "0000000000000000";
              'SWIFT_ASSEMBLY_VERSION' = "${{ needs.context.outputs.swift_version }}";
              'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
              'CMAKE_FIND_PACKAGE_PREFER_CONFIG' = "YES";
              'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
              'SwiftCore_DIR' = "${{ github.workspace }}/BinaryCache/Runtime/cmake/SwiftCore";
              'SwiftOverlay_DIR' = "${{ github.workspace }}/BinaryCache/Overlay/cmake/SwiftOverlay";
              'SwiftCxxOverlay_DIR' = "${{ github.workspace }}/BinaryCache/Overlay/Cxx/cmake/SwiftCxxOverlay";
              # FIXME(compnerd) this currently causes a build failure on Windows, but
              # this should be enabled when building the dynamic runtime.
              'SwiftRuntime_ENABLE_LIBRARY_EVOLUTION' = "NO";
              'SwiftRuntime_ENABLE_BACKTRACING' = "YES";
            }
      - name: Build RuntimeModule
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/RuntimeModule
      - name: Install RuntimeModule
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/RuntimeModule --target install

      # build.ps1: Build-SDK
      - name: Configure Backtrace
        # NOTE: we only build this if static variants are enabled to ensure that we
        # can statically link the runtime.
        # Disabled for Windows x86 https://github.com/swiftlang/swift/issues/87499
        if: matrix.static && matrix.arch != 'x86'
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: RuntimeBacktrace
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: Windows
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift/Runtimes/Supplemental/StackWalker
          bin-dir: ${{ github.workspace }}/BinaryCache/RuntimeBacktrace
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          cmake-defines: |
            @{
              'SWIFT_PUBLIC_KEY_TOKEN' = "0000000000000000";
              'SWIFT_ASSEMBLY_VERSION' = "${{ needs.context.outputs.swift_version }}";
              'CMAKE_Swift_FLAGS' = @("-static-stdlib");
              'SwiftCore_DIR' = "${{ github.workspace }}/BinaryCache/Runtime/cmake/SwiftCore";
              'SwiftOverlay_DIR' = "${{ github.workspace }}/BinaryCache/Overlay/cmake/SwiftOverlay";
              'SwiftCxxOverlay_DIR' = "${{ github.workspace }}/BinaryCache/Overlay/Cxx/cmake/SwiftCxxOverlay";
              'SwiftRuntime_DIR' = "${{ github.workspace }}/BinaryCache/RuntimeModule/cmake/SwiftRuntime";
            }
      - name: Build Runtime Backtrace
        # NOTE: we only build this if static variants are enabled to ensure that we
        # can statically link the runtime.
        # Disabled for Windows x86 https://github.com/swiftlang/swift/issues/87499
        if: matrix.static && matrix.arch != 'x86'
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/RuntimeBacktrace
      - name: Install Runtime Backtrace
        # NOTE: we only build this if static variants are enabled to ensure that we
        # can statically link the runtime.
        # Disabled for Windows x86 https://github.com/swiftlang/swift/issues/87499
        if: matrix.static && matrix.arch != 'x86'
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/RuntimeBacktrace --target install

      # build.ps1: Build-SDK
      - name: Configure Dispatch
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Dispatch
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: Windows
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-corelibs-libdispatch
          bin-dir: ${{ github.workspace }}/BinaryCache/Dispatch
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          swift-sdk-path: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk
          cmake-defines: |
            @{
               'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
               'BUILD_TESTING' = "NO";
               'CMAKE_FIND_PACKAGE_PREFER_CONFIG' = "YES";
               'CMAKE_Swift_FLAGS' = ${{ matrix.static && '@("-static-stdlib", "-Xfrontend", "-use-static-resource-dir")' || '@()' }};
               'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
               'ENABLE_SWIFT' = "YES";
               'dispatch_INSTALL_ARCH_SUBDIR' = "YES";
              }
      - name: Build Dispatch
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Dispatch
      - name: Install Dispatch
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Dispatch --target install

      # build.ps1: Build-SDK
      - name: Configure Foundation
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Foundation
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: Windows
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-corelibs-foundation
          bin-dir: ${{ github.workspace }}/BinaryCache/Foundation
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr
          c-compiler: 'Stage1.GNUC'
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          swift-sdk-path: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "${{ matrix.static && 'NO' || 'YES' }}";
              'CMAKE_NINJA_FORCE_RESPONSE_FILE' = "YES";
              'CMAKE_Swift_FLAGS' = ${{ matrix.static && '@("-static-stdlib", "-Xfrontend", "-use-static-resource-dir")' || '@()' }};
              'CMAKE_STATIC_LIBRARY_PREFIX_Swift' = "lib";
              'ENABLE_TESTING' = "NO";
              'FOUNDATION_BUILD_TOOLS' = "${{ matrix.static && 'YES' || 'NO' }}";
              'CURL_DIR' = "${{ github.workspace }}/BuildRoot/Library/curl-${{ needs.context.outputs.curl_version }}/usr/lib/cmake/CURL";
              'BROTLI_INCLUDE_DIR' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/include";
              'BROTLICOMMON_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/lib/brotlicommon.lib";
              'BROTLIDEC_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/brotli-${{ needs.context.outputs.brotli_version }}/usr/lib/brotlidec.lib";
              'LibXml2_DIR' = "${{ github.workspace }}/BuildRoot/Library/libxml2-${{ needs.context.outputs.libxml2_version }}/usr/lib/cmake/libxml2-${{ needs.context.outputs.libxml2_version }}";
              'ZLIB_INCLUDE_DIR' = "${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr/include";
              'ZLIB_LIBRARY' = "${{ github.workspace }}/BuildRoot/Library/zlib-${{ needs.context.outputs.zlib_version }}/usr/lib/zlibstatic.lib";
              'dispatch_DIR' = "${{ github.workspace }}/BinaryCache/Dispatch/cmake/modules";
              '_SwiftFoundation_SourceDIR' = "${{ github.workspace }}/SourceCache/swift-foundation";
              '_SwiftFoundationICU_SourceDIR' = "${{ github.workspace }}/SourceCache/swift-foundation-icu";
              '_SwiftCollections_SourceDIR' = "${{ github.workspace }}/SourceCache/swift-collections";
              'SwiftFoundation_MACRO' = "${{ github.workspace }}/BinaryCache/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/bin";
            }
      - name: Build Foundation
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Foundation
      - name: Install Foundation
        run: |
          cmake --build ${{ github.workspace }}/BinaryCache/Foundation --target install

      - name: Repair SDK Headers
        run: |
          $SDKRoot = cygpath -w "${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk"
          foreach ($Module in ("Block", "dispatch", "os", "_foundation_unicode", "_FoundationCShims", "_FoundationInternationalizationData")) {
            foreach ($ResourceType in ("swift", "swift_static")) {
              $ModuleDirectory = "$SDKRoot\usr\lib\$ResourceType\$Module"
              if (Test-Path $ModuleDirectory) {
                New-Item -ItemType Directory -Force "$SDKRoot\usr\include" | Out-Null
                $Destination = "$SDKRoot\usr\include\$Module"
                if (Test-Path $Destination) { Remove-Item -Recurse -Force $Destination }
                Move-Item -Path $ModuleDirectory -Destination $Destination -Force
              }
            }
          }

      - name: Repair Dispatch VFS Overlay
        run: |
          $DispatchVFS = "${{ github.workspace }}/BinaryCache/Dispatch/dispatch-vfs-overlay.yaml"
          if (Test-Path $DispatchVFS) {
            $DispatchSrc = "${{ github.workspace }}/SourceCache/swift-corelibs-libdispatch/dispatch".Replace('\', '/')
            $InstalledMap = "${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/usr/include/dispatch/module.modulemap".Replace('\', '/')
            Set-Content -Path $DispatchVFS -Encoding UTF8 -Value @(
              '---',
              'version: 0',
              'case-sensitive: false',
              'use-external-names: false',
              'roots:',
              "  - name: '$DispatchSrc'",
              '    type: directory',
              '    contents:',
              '      - name: module.modulemap',
              '        type: file',
              "        external-contents: '$InstalledMap'"
            )
          }

      - uses: actions/setup-python@v5
      - uses: jannekem/run-python-script-action@v1
        with:
          script: |
            import os
            import plistlib

            info_plist = r'${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Info.plist'
            with open(os.path.normpath(info_plist), 'wb') as plist:
              # TODO(compnerd) derive this from the install directory
              plistlib.dump({ 'DefaultProperties': { 'XCTEST_VERSION': '${{ needs.context.outputs.swift_version }}', 'SWIFT_TESTING_VERSION': '${{ needs.context.outputs.swift_version }}', 'SWIFTC_FLAGS': ['-use-ld=lld'] } }, plist)

      - name: Write SDK Settings
        run: |
          $SDKSettings = @{
            CanonicalName = "windows"
            DisplayName = "Windows"
            IsBaseSDK = "YES"
            Version = "${{ needs.context.outputs.swift_version }}"
            VersionMap = @{}
            HeaderSearchPaths = @( "usr/include" )
            LibrarySearchPaths = @()
            DefaultProperties = @{
              PLATFORM_NAME = "windows"
            }
            SupportedTargets = @{
              windows = @{
                PlatformFamilyDisplayName = "Windows"
                PlatformFamilyName = "Windows"
                Archs = @("$(("${{ matrix.triple }}" -split '-')[0])")
              }
            }
          }
          $SDKSettings.DefaultProperties.DEFAULT_USE_RUNTIME = "MD"
          $SDKSettings.SupportedTargets.windows.LLVMTargetVendor = "unknown"
          $SDKSettings.SupportedTargets.windows.LLVMTargetSys = "windows"
          $SDKSettings.SupportedTargets.windows.LLVMTargetTripleEnvironment = "msvc"
          New-Item -ItemType Directory -Path "${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk" -Force | Out-Null
          $SDKSettings | ConvertTo-JSON -Depth 4 | Out-File -FilePath "${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/SDKSettings.json"

          $PListFile = "${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk/SDKSettings.plist"
          python3 -c "import plistlib; print(str(plistlib.dumps($(($SDKSettings | ConvertTo-JSON -Compress -Depth 4) -replace '"', "'")), encoding='utf-8'))" | Out-File -FilePath $PListFile -Encoding utf8

      # build.ps1: Build-SDK -> Build-Testing (shared SDK only).
      - name: Configure Testing
        if: ${{ !matrix.static }}
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: Testing
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: Windows
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-testing
          bin-dir: ${{ github.workspace }}/BinaryCache/Testing
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/Library/Testing-${{ needs.context.outputs.swift_version }}/usr
          cxx-compiler: 'Stage1.GNUCXX'
          swift-compiler: 'Stage1.Swift'
          swift-sdk-path: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "YES";
              'CMAKE_INSTALL_BINDIR' = "${{ (matrix.arch == 'amd64' || matrix.arch == 'x86_64') && 'bin64' || matrix.arch == 'arm64' && 'bin64a' || matrix.arch == 'armv7' && 'bin32a' || 'bin32' }}";
              'CMAKE_Swift_FLAGS' = @();
              'SwiftTesting_MACRO' = "${{ github.workspace }}/BinaryCache/Library/Developer/Toolchains/${{ needs.context.outputs.swift_version }}+Asserts/usr/bin/TestingMacros.dll";
              'SwiftTesting_INSTALL_NESTED_SUBDIR' = "YES";
            }
      - name: Build Testing
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/Testing
      - name: Install Testing
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/Testing --target install

      # build.ps1: Build-SDK -> Build-XCTest (shared SDK only).
      # TODO(compnerd) correctly version XCTest
      - name: Configure XCTest
        if: ${{ !matrix.static }}
        uses: ./SourceCache/ci-build/.github/actions/configure-cmake-project
        with:
          project-name: XCTest
          swift-version: ${{ needs.context.outputs.swift_version }}
          enable-caching: false
          debug-info: ${{ needs.context.outputs.debug_info }}
          build-arch: ${{ needs.context.outputs.build_arch }}
          os: Windows
          arch: ${{ matrix.arch }}
          src-dir: ${{ github.workspace }}/SourceCache/swift-corelibs-xctest
          bin-dir: ${{ github.workspace }}/BinaryCache/XCTest
          install-dir: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/Library/XCTest-${{ needs.context.outputs.swift_version }}/usr
          swift-compiler: 'Stage1.Swift'
          swift-sdk-path: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform/Developer/SDKs/Windows.sdk
          cmake-defines: |
            @{
              'BUILD_SHARED_LIBS' = "YES";
              'CMAKE_INSTALL_BINDIR' = "${{ (matrix.arch == 'amd64' || matrix.arch == 'x86_64') && 'bin64' || matrix.arch == 'arm64' && 'bin64a' || matrix.arch == 'armv7' && 'bin32a' || 'bin32' }}";
              'CMAKE_Swift_FLAGS' = @();
              'ENABLE_TESTING' = "NO";
              'XCTest_INSTALL_NESTED_SUBDIR' = "YES";
              'SwiftTesting_DIR' = "${{ github.workspace }}/BinaryCache/Testing/cmake/modules";
            }
      - name: Build XCTest
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/XCTest
      - name: Install XCTest
        if: ${{ !matrix.static }}
        run: cmake --build ${{ github.workspace }}/BinaryCache/XCTest --target install

      - uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}-${{ matrix.static && 'static' || 'shared' }}-sdk
          path: ${{ github.workspace }}/BuildRoot/Library/Developer/Platforms/Windows.platform

      - name: Upload PDBs to Azure
        uses: thebrowsercompany/action-publish-symbols@d5f4b06266463bf9a71ef6a4e3b0b8d79eaa82a4
        if: ${{ fromJSON(needs.context.outputs.debug_info) }}
        with:
          accountName: ${{ vars.SYMBOL_SERVER_ACCOUNT }}
          personalAccessToken: ${{ secrets.SYMBOL_SERVER_PAT }}
          symbolsFolder: ${{ github.workspace }}/BinaryCache
          searchPattern: '**/*.pdb'

      - name: Upload PDBs to Public Symbol Server
        uses: ./SourceCache/ci-build/.github/actions/publish-symbols-r2
        if: ${{ fromJSON(needs.context.outputs.debug_info) && fromJSON(needs.context.outputs.release) }}
        with:
          symbolsFolder: ${{ github.workspace }}/BinaryCache
          searchPattern: '*.pdb'
          swift-version: ${{ needs.context.outputs.swift_version }}
          arch: ${{ matrix.arch }}
          variant: ${{ matrix.static && 'static' || 'shared' }}
          build-revision: ${{ needs.context.outputs.swift_build_revision }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Upload DLLs to Azure
        uses: thebrowsercompany/action-publish-symbols@d5f4b06266463bf9a71ef6a4e3b0b8d79eaa82a4
        if: ${{ fromJSON(needs.context.outputs.debug_info) }}
        with:
          accountName: ${{ vars.SYMBOL_SERVER_ACCOUNT }}
          personalAccessToken: ${{ secrets.SYMBOL_SERVER_PAT }}
          symbolsFolder: ${{ github.workspace }}/BinaryCache
          searchPattern: '**/*.dll'
